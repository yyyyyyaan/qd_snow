<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#B23A2E" />
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">02 / 解码算法与系统方案</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">Union-Find 只有三个动作：生长、合并、投票</text>
    <rect x="1184" y="40" width="8" height="8" fill="#5A6672" />
    <text x="1208" y="49" font-size="15" fill="#5A6672" text-anchor="end">基础</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1" />
  </g>

  <g id="stage-grow" data-pptx-bounds="72 170 360 220">
    <line x1="72" y1="176" x2="432" y2="176" stroke="#12263A" stroke-width="2" />
    <text x="72" y="216" font-size="26" font-weight="bold" fill="#12263A">01　生长</text>
    <text font-size="22" fill="#1B2632" x="72" y="262">每个簇按边向外扩</text><text font-size="22" fill="#1B2632" x="72" y="294">半条边 +½，2:1 调度</text><text font-size="22" fill="#1B2632" x="72" y="326">生长值只需 2 bit</text></g>

  <g id="stage-merge" data-pptx-bounds="460 170 360 220">
    <line x1="460" y1="176" x2="820" y2="176" stroke="#12263A" stroke-width="2" />
    <text x="460" y="216" font-size="26" font-weight="bold" fill="#12263A">02　合并</text>
    <text font-size="22" fill="#1B2632" x="460" y="262">两个簇在一条边上相遇</text><text font-size="22" fill="#1B2632" x="460" y="294">取较小簇标识做新根</text><text font-size="22" fill="#1B2632" x="460" y="326">缺陷沿指针上推、湮灭</text></g>

  <g id="stage-vote" data-pptx-bounds="848 170 360 220">
    <line x1="848" y1="176" x2="1208" y2="176" stroke="#12263A" stroke-width="2" />
    <text x="848" y="216" font-size="26" font-weight="bold" fill="#12263A">03　投票</text>
    <text font-size="22" fill="#1B2632" x="848" y="262">探测器数为奇数则标记</text><text font-size="22" fill="#1B2632" x="848" y="294">由边决定哪些比特翻转</text><text font-size="22" fill="#1B2632" x="848" y="326">只依赖邻居，无全局结构</text></g>

  <g id="stage-flow" data-pptx-bounds="432 246 24 24">
    <line x1="436" y1="258" x2="452" y2="258" stroke="#B23A2E" stroke-width="1.6" marker-end="url(#arrow-step)" />
  </g>
  <g id="stage-flow-2" data-pptx-bounds="820 246 24 24">
    <line x1="824" y1="258" x2="840" y2="258" stroke="#B23A2E" stroke-width="1.6" marker-end="url(#arrow-step)" />
  </g>

  <g id="hardware-why" data-pptx-bounds="72 470 1136 90">
    <rect x="72" y="470" width="1136" height="90" fill="#F2F4F7" />
    <rect x="72" y="470" width="4" height="90" fill="#2C6E9B" />
    <text x="104" y="508" font-size="26" fill="#12263A">为什么适合硬件：三个动作都只看邻居，没有全局数据结构。</text>
    <text x="104" y="540" font-size="15" fill="#5A6672">这也是它能被拆成一节点一 PE 的前提</text>
  </g>

  <g id="scope-note" data-pptx-bounds="72 580 1136 40">
    <text x="72" y="600" font-size="15" fill="#5A6672">本页只讲机制，不证明最优性，也不与 MWPM 比较阈值</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1" />
    <text x="72" y="666" font-size="15" fill="#5A6672">半条边生长与 2:1 调度来自 Snowflake 论文，本页只做机制解释</text>
  </g>
</svg>