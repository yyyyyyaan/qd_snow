  <g id="state-line" data-pptx-bounds="72 486 628 120">
    <text x="72" y="512" font-size="15" fill="#5A6672" letter-spacing="1.2">这五个分支共享的全部状态</text>
    <text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="72" y="546">reg [SNOW_CID_W-1:0] cid;   reg active, whole;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="72" y="568">reg defect, grown, unrooted, busy;   reg [SNOW_PTR_W-1:0] ptr;</text><text x="72" y="600" font-size="15" fill="#5A6672">没有消息缓冲区，也没有跨节点状态</text>
  </g>

  <g id="packed" data-pptx-bounds="740 180 468 420">
    <text x="740" y="208" font-size="15" fill="#5A6672" letter-spacing="1.2">共享晶格版：同一组字段打包成一个状态字</text>
    <text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#12263A" x="740" y="244">localparam SNOW_PE_STW =</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#12263A" x="740" y="270">    7 + SNOW_PTR_W + SNOW_CID_W;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="312">OFF_BUSY = 0</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="338">OFF_UNR  = 1</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="364">OFF_GRW  = 2</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="390">OFF_PTR  = 3</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="416">OFF_DEF  = 3 + SNOW_PTR_W</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="442">OFF_WHL  = 4 + SNOW_PTR_W</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="468">OFF_ACT  = 5 + SNOW_PTR_W</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="15" fill="#2C6E9B" x="740" y="494">OFF_CID  = 6 + SNOW_PTR_W</text><text x="740" y="560" font-size="15" fill="#5A6672">没有 struct，只有一段位偏移；</text>
    <text x="740" y="584" font-size="15" fill="#5A6672">数组把状态存在自己的寄存器堆里。</text>
  </g>

