    <text font-size="22" fill="#1B2632" x="720" y="420">一节点一 PE：每个节点一个状态机</text><text font-size="22" fill="#1B2632" x="720" y="460">一边一边链路：不用路由、不用缓冲</text><text font-size="22" fill="#1B2632" x="720" y="500">邻居表是常量位选，不是运行时索引</text><text font-size="22" fill="#1B2632" x="720" y="540">distributed 指顶点级并行，不是多 FPGA</text><text x="720" y="590" font-size="15" fill="#5A6672">论文第 10 页：跨片 I/O 与数十 ns 延迟，禁止多 FPGA</text>
