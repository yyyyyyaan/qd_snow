<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">03 / 硬件架构与关键模块</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">Algorithm 9：Compare 找根，Syncing 推缺陷</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B" />
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1" />
  </g>

  <g id="alg9-code" data-pptx-bounds="72 176 688 450">
    <rect x="72" y="176" width="688" height="450" fill="#F2F4F7" />
    <text x="96" y="204" font-size="15" fill="#5A6672">Compare（节选 snowflake_pe.sv:579-621）</text>
    <text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="234">best_cid = cid;  best_found = 1'b0;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="253">for (d = 0; d &lt; SNOW_NDIR; d = d + 1)</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="272">  if (nb_valid[d] &amp;&amp; e_grown[d])</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="291">    if (nb_cid[d*W +: W] &lt; best_cid) begin</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="310">      busy_c   = 1'b1;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="329">      best_cid = nb_cid[d*W +: W];</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="348">      best_d   = d;  best_found = 1'b1;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="367">    end</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="386">if (best_found) begin</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="405">  n_ptr = DIR2PTR(best_d);</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="424">  n_cid = best_cid;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#1B2632" x="96" y="443">end</text><text x="96" y="486" font-size="15" fill="#5A6672">Syncing（snowflake_pe.sv:648-660）</text>
    <text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#12263A" x="96" y="516">det_def = (!K_IS_BND) &amp;&amp; defect;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#12263A" x="96" y="535">if (n_ptr == SNOW_PTR_C) n_active = det_def;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#12263A" x="96" y="554">else begin d = n_ptr - 1'b1;</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#12263A" x="96" y="573">  n_active = nb_active[d];</text><text font-family="Consolas, Cascadia Mono, Courier New, monospace" font-size="14" fill="#12263A" x="96" y="592">  if (det_def) push[d] = 1'b1; end</text></g>

  <g id="alg9-notes" data-pptx-bounds="800 176 408 450">
    <text x="800" y="206" font-size="26" font-weight="bold" fill="#12263A">两段，都在合并里</text>
    <text x="800" y="252" font-size="22" font-weight="bold" fill="#12263A">Compare：12 深的比较链</text>
    <text x="800" y="284" font-size="22" fill="#1B2632">就是 d7 的关键路径</text>
    <text x="800" y="334" font-size="22" font-weight="bold" fill="#12263A">Syncing：活跃性与缺陷</text>
    <text x="800" y="366" font-size="22" fill="#1B2632">都沿指针往根的方向走</text>
    <text font-size="15" fill="#5A6672" x="800" y="414">根：active 就看自己有没有缺陷</text><text font-size="15" fill="#5A6672" x="800" y="442">非根：active 取自父节点，缺陷用 push 推出去</text><text font-size="15" fill="#5A6672" x="800" y="470">两路 push 同时到达会异或抵消（:664-670）</text><text x="800" y="508" font-size="15" fill="#B23A2E">MINTS 把这 12 深拆成 3 组，用 3 拍换掉</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1" />
    <text x="72" y="666" font-size="15" fill="#5A6672">FloodingWhole / FloodingHalf 是这两个块的外层，区别只在 RESET 分支</text>
  </g>
</svg>