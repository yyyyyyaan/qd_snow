<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">02 / 解码算法与系统方案</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">Algorithm 2：frugal 周期，抬一层就提交一层</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="cycle-fsm" data-pptx-bounds="72 176 688 264">
    <rect x="72" y="176" width="688" height="264" fill="#F2F4F7"/>
    <text x="96" y="206" font-size="15" fill="#5A6672">snowflake_pe_array.sv:780-847（一个解码周期的五个阶段）</text>
    <text x="96" y="242" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">ST_DROP: begin stage &lt;= ST_GW; step_cnt &lt;= 8'd1; end      // :781<tspan x="96" dy="21">ST_GW:   begin stage &lt;= ST_MW; step_cnt &lt;= 8'd1; end      // :782</tspan><tspan x="96" dy="21">ST_MW:   if (!any_c_busy)</tspan><tspan x="96" dy="21">           begin stage &lt;= ST_GH; step_cnt &lt;= 8'd1; end    // :830-837</tspan><tspan x="96" dy="21">         else step_cnt &lt;= step_cnt + 8'd1;</tspan><tspan x="96" dy="21">ST_GH:   begin stage &lt;= ST_MH; step_cnt &lt;= 8'd1; end      // :840</tspan><tspan x="96" dy="21">ST_MH:   if (!any_c_busy)</tspan><tspan x="96" dy="21">           begin stage &lt;= ST_IDLE; done &lt;= 1'b1; end       // :841-847</tspan></text>
  </g>

  <g id="cycle-drop" data-pptx-bounds="800 176 408 264">
    <text x="800" y="206" font-size="15" fill="#5A6672" letter-spacing="1.2">DROP 拍：把状态从上一层拉下来</text>
    <text x="800" y="242" font-size="14" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">n_cid = (ab_cid == SNOW_RESET_CID)<tspan x="800" dy="22">        ? SNOW_RESET_CID</tspan><tspan x="800" dy="22">        : (ab_cid + SNOW_CID_DELTA(ab_cid));</tspan></text>
    <text x="800" y="330" font-size="15" fill="#5A6672">snowflake_pe.sv:392-393；每个节点只拉自己上一层</text>
    <text x="800" y="372" font-size="22" fill="#1B2632">一拍 = 一个 timestep<tspan x="800" dy="32">抬 1 层、提交 1 层</tspan></text>
  </g>

  <g id="cycle-law" data-pptx-bounds="72 470 1136 80">
    <rect x="72" y="470" width="1136" height="80" fill="#F2F4F7"/>
    <rect x="72" y="470" width="4" height="80" fill="#2C6E9B"/>
    <text x="104" y="506" font-size="22" fill="#12263A">c = 1：每轮只抬一层、只提交一层，所以没有丢弃的层。</text>
    <text x="104" y="534" font-size="15" fill="#5A6672">Algorithm 1 的批处理（抬 c 层、提交 c 层）在本实现里不存在</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">阶段机与扁平核逐条对应；回归比的正是这五段产生的轨迹行</text>
  </g>
</svg>
