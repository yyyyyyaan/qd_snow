<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">04 / RTL 实现与综合结果</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">生成表长什么样：36 个节点、51 条边，全是常量</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="table-code" data-pptx-bounds="72 176 688 360">
    <rect x="72" y="176" width="688" height="360" fill="#F2F4F7"/>
    <text x="96" y="204" font-size="15" fill="#5A6672">generate_snowflake.py 写出的 snowflake_graph_surface_d3.svh</text>
    <text x="96" y="240" font-size="14" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">localparam integer SNOW_NN    = 36;   // 节点数<tspan x="96" dy="21">localparam integer SNOW_NE    = 51;   // 边数</tspan><tspan x="96" dy="21">localparam integer SNOW_NSYN  = 6;    // 综合症位数</tspan><tspan x="96" dy="21">localparam integer SNOW_CID_W = 7;    // 簇号位宽</tspan><tspan x="96" dy="21">localparam integer SNOW_NDIR  = 12;   // 方向数</tspan></text>
    <text x="96" y="378" font-size="14" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">localparam [215:0]  SNOW_ABOVE_VEC = {6'd29, ..., 6'd63};<tspan x="96" dy="21">localparam [35:0]   SNOW_BND_VEC   = {1'd0, ..., 1'd1};</tspan><tspan x="96" dy="21">localparam [2591:0] SNOW_NB_VEC    = {6'd63, ..., 6'd63};</tspan></text>
    <text x="96" y="470" font-size="15" fill="#5A6672">阵列里是常量位选，不是数组下标</text>
    <text x="96" y="494" font-size="14" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">localparam integer ABOVE = SNOW_ABOVE_VEC[n*NW +: NW];<tspan x="96" dy="21">localparam integer NBR   = SNOW_NB_VEC[(n*NDIR+d)*NW +: NW];</tspan></text>
  </g>

  <g id="table-why" data-pptx-bounds="800 176 408 360">
    <text x="800" y="206" font-size="26" font-weight="bold" fill="#12263A">三句话</text>
    <text x="800" y="252" font-size="22" font-weight="bold" fill="#12263A">规模写死</text>
    <text x="800" y="282" font-size="22" fill="#1B2632">节点数、边数、位宽都是常量</text>
    <text x="800" y="332" font-size="22" font-weight="bold" fill="#12263A">哨兵统一</text>
    <text x="800" y="362" font-size="22" fill="#1B2632">63 = 6'b111111 表示没有邻居</text>
    <text x="800" y="412" font-size="22" font-weight="bold" fill="#12263A">位选是常量</text>
    <text x="800" y="442" font-size="22" fill="#1B2632">综合后是固定连线，不是查表</text>
    <text x="800" y="490" font-size="15" fill="#5A6672">解码器本体：LUTRAM 0 / BRAM 0 / DSP 0</text>
  </g>

  <g id="table-law" data-pptx-bounds="72 556 1136 76">
    <rect x="72" y="556" width="1136" height="76" fill="#F2F4F7"/>
    <rect x="72" y="556" width="4" height="76" fill="#B23A2E"/>
    <text x="104" y="588" font-size="22" fill="#12263A">换码型 = 重跑生成器 + 重综合，RTL 一行不改。</text>
    <text x="104" y="616" font-size="15" fill="#B23A2E">canonical 的 snowflake_graph.svh 是过期别名，构建前必须重钉</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 640 1136 40">
    <text x="72" y="666" font-size="15" fill="#5A6672">数组省略了中间项；完整表由 generate_snowflake.py 写在同一目录</text>
  </g>
</svg>
