<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">03 / 硬件架构与关键模块</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">Algorithm 3：Grow 与 Merge 落在一条边上</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="edge-code" data-pptx-bounds="72 176 688 420">
    <rect x="72" y="176" width="688" height="420" fill="#F2F4F7"/>
    <text x="96" y="206" font-size="15" fill="#5A6672">snowflake_edge.sv:65-109（一条边的全部语义）</text>
    <text x="96" y="242" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">reg [1:0] growth;  reg ecorr;   // 这就是全部状态<tspan x="96" dy="21">wire growing = (stage == ST_GW) || (stage == ST_GH);</tspan><tspan x="96" dy="21">wire merging = (stage == ST_MW) || (stage == ST_MH);</tspan><tspan x="96" dy="21">wire [1:0] inc = {1'b0,u_pulse} + {1'b0,v_pulse};</tspan><tspan x="96" dy="21">wire [1:0] grown_n = (growth + inc &gt; 2'd2)</tspan><tspan x="96" dy="21">                    ? 2'd2 : growth + inc;</tspan><tspan x="96" dy="31">always @(posedge clk) begin</tspan><tspan x="96" dy="21">  if (reset) begin growth &lt;= 0; ecorr &lt;= 0; end</tspan><tspan x="96" dy="21">  else if (stage == ST_DROP) begin</tspan><tspan x="96" dy="21">    growth &lt;= above_growth;</tspan><tspan x="96" dy="21">    ecorr  &lt;= above_ecorr;</tspan><tspan x="96" dy="21">  end else if (growing) begin</tspan><tspan x="96" dy="21">    if (growth &lt; 2'd2) growth &lt;= grown_n;</tspan><tspan x="96" dy="21">  end else if (merging) begin</tspan><tspan x="96" dy="21">    if (flip_u ^ flip_v) ecorr &lt;= ecorr ^ 1'b1;</tspan><tspan x="96" dy="21">  end</tspan><tspan x="96" dy="21">end</tspan></text>
  </g>

  <g id="edge-rules" data-pptx-bounds="800 176 408 420">
    <text x="800" y="206" font-size="26" font-weight="bold" fill="#12263A">Grow 与 Merge 在这里</text>
    <text x="800" y="252" font-size="22" font-weight="bold" fill="#12263A">① Grow：两端各推半条</text>
    <text x="800" y="282" font-size="22" fill="#1B2632">+½ 累加，饱和在 2（只有三态）</text>
    <text x="800" y="332" font-size="22" font-weight="bold" fill="#12263A">② Merge：沿路径翻转</text>
    <text x="800" y="362" font-size="22" fill="#1B2632">两端同时翻转就异或相消，边记 ecorr</text>
    <text x="800" y="412" font-size="22" font-weight="bold" fill="#12263A">③ Drop：继承上一层</text>
    <text x="800" y="442" font-size="22" fill="#1B2632">growth 与 ecorr 直接覆盖</text>
    <text x="800" y="496" font-size="15" fill="#5A6672">选根在 pe.sv:648-670 完成，这里只记翻转</text>
    <text x="800" y="528" font-size="15" fill="#5A6672">d3 的图里 51 条边，每边只摊约 5.6 LUT</text>
    <text x="800" y="566" font-size="15" fill="#B23A2E">复位值必须是 0，不是继承值</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">u_pulse / v_pulse 是两端 PE 的生长脉冲；flip_u / flip_v 是两端是否翻转</text>
  </g>
</svg>
