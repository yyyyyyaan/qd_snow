<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">03 / 硬件架构与关键模块</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">PE 的状态就是一个簇号加几根标志位</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="state-code" data-pptx-bounds="72 176 588 390">
    <rect x="72" y="176" width="588" height="380" fill="#F2F4F7"/>
    <text x="96" y="206" font-size="15" fill="#5A6672">snowflake_pe.sv:198-201（默认形态）</text>
    <text x="96" y="248" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">reg [SNOW_CID_W-1:0] cid;      // 根是谁<tspan x="96" dy="26">reg                  active;   // 是否活跃</tspan><tspan x="96" dy="26">reg                  whole;    // 整簇标记</tspan><tspan x="96" dy="26">reg                  defect;   // 缺陷位</tspan><tspan x="96" dy="26">reg                  grown;    // 生长值</tspan><tspan x="96" dy="26">reg                  unrooted; // 是否已剥离</tspan><tspan x="96" dy="26">reg                  busy;     // 本拍还要算吗</tspan><tspan x="96" dy="26">reg [SNOW_PTR_W-1:0] ptr;      // 父指针</tspan></text>
    <text x="96" y="470" font-size="15" fill="#5A6672">组合次态：一拍之内算出下一组值</text>
    <text x="96" y="500" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">reg [SNOW_CID_W-1:0] n_cid;</text>
    <text x="96" y="526" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">reg                  n_active, n_whole, n_defect;</text>
    <text x="96" y="552" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">reg                  n_grown, n_unrooted, busy_c;</text>
  </g>

  <g id="packed-code" data-pptx-bounds="700 176 508 390">
    <text x="700" y="206" font-size="15" fill="#5A6672" letter-spacing="1.2">共享晶格版：同一组字段打包成一个状态字</text>
    <text x="700" y="248" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">localparam SNOW_PE_STW =<tspan x="700" dy="26">    7 + SNOW_PTR_W + SNOW_CID_W;</tspan></text>
    <text x="700" y="306" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#2C6E9B">OFF_BUSY = 0<tspan x="700" dy="26">OFF_UNR  = 1</tspan><tspan x="700" dy="26">OFF_GRW  = 2</tspan><tspan x="700" dy="26">OFF_PTR  = 3</tspan><tspan x="700" dy="26">OFF_DEF  = 3 + SNOW_PTR_W</tspan><tspan x="700" dy="26">OFF_WHL  = 4 + SNOW_PTR_W</tspan><tspan x="700" dy="26">OFF_ACT  = 5 + SNOW_PTR_W</tspan><tspan x="700" dy="26">OFF_CID  = 6 + SNOW_PTR_W</tspan></text>
    <text x="700" y="528" font-size="15" fill="#5A6672">没有 struct，只有一段位偏移；</text>
    <text x="700" y="552" font-size="15" fill="#5A6672">数组把状态存在自己的寄存器堆里。</text>
  </g>

  <g id="state-takeaway" data-pptx-bounds="72 570 1136 56">
    <text x="72" y="606" font-size="22" fill="#12263A">没有消息缓冲区、没有跨节点状态：每节点寄存器 d3 22.1 / d5 24.8 / d7 26.4。</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">状态全部落在本节点，这是上下文切换能便宜的前提</text>
  </g>
</svg>
