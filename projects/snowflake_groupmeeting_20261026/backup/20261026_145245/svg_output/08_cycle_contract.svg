<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-cycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12263A"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">02 / 解码算法与系统方案</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">一拍 = 算法的一个 timestep，这条契约不能破</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="drop-code" data-pptx-bounds="72 176 568 200">
    <rect x="72" y="176" width="568" height="200" fill="#F2F4F7"/>
    <text x="96" y="206" font-size="15" fill="#5A6672">snowflake_core.sv:392-393</text>
    <text x="96" y="250" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">n_cid = (ab_cid == SNOW_RESET_CID)<tspan x="96" dy="28">      ? SNOW_RESET_CID</tspan><tspan x="96" dy="28">      : (ab_cid + SNOW_CID_DELTA(ab_cid));</tspan></text>
    <text x="96" y="346" font-size="15" fill="#5A6672">DROP 拍：把窗口整体向上拉一层</text>
  </g>

  <g id="contract-list" data-pptx-bounds="680 176 528 300">
    <text x="680" y="210" font-size="22" font-weight="bold" fill="#12263A">一拍推进一个生长轮</text>
    <text x="680" y="242" font-size="22" fill="#1B2632">不是一次测量</text>
    <text x="680" y="306" font-size="22" font-weight="bold" fill="#12263A">每拍恰写一行轨迹</text>
    <text x="680" y="338" font-size="22" fill="#1B2632">回归逐行比的就是这一行</text>
    <text x="680" y="402" font-size="22" font-weight="bold" fill="#12263A">静默但未切换的那一拍被屏蔽</text>
    <text x="680" y="434" font-size="22" fill="#1B2632">否则轨迹会多出一行</text>
  </g>

  <g id="cycle-strip" data-pptx-bounds="72 480 968 80">
    <rect x="72" y="480" width="200" height="56" fill="#FFFFFF" stroke="#12263A" stroke-width="1.4"/>
    <text x="172" y="516" font-size="22" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A" text-anchor="middle">DROP</text>
    <line x1="272" y1="508" x2="322" y2="508" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-cycle)"/>
    <rect x="328" y="480" width="200" height="56" fill="#FFFFFF" stroke="#12263A" stroke-width="1.4"/>
    <text x="428" y="516" font-size="22" fill="#12263A" text-anchor="middle">生长</text>
    <line x1="528" y1="508" x2="578" y2="508" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-cycle)"/>
    <rect x="584" y="480" width="200" height="56" fill="#FFFFFF" stroke="#12263A" stroke-width="1.4"/>
    <text x="684" y="516" font-size="22" fill="#12263A" text-anchor="middle">合并</text>
    <line x1="784" y1="508" x2="834" y2="508" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-cycle)"/>
    <rect x="840" y="480" width="200" height="56" fill="#12263A"/>
    <text x="940" y="516" font-size="22" fill="#FFFFFF" text-anchor="middle">提交</text>
  </g>

  <g id="cycle-note" data-pptx-bounds="72 592 1136 40">
    <text x="72" y="616" font-size="22" fill="#5A6672">门的深度 ≠ 拍数；一次测量产生的是整层探测器。</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">行号为当前工作区版本；改图后需重新核对</text>
  </g>
</svg>
