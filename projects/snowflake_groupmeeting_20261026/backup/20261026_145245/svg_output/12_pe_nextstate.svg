<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">03 / 硬件架构与关键模块</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">合并只做一件事：在 12 个邻居里找最小 CID</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="minsearch-code" data-pptx-bounds="72 176 648 436">
    <rect x="72" y="176" width="648" height="436" fill="#F2F4F7"/>
    <text x="96" y="206" font-size="15" fill="#5A6672">snowflake_pe.sv:579-621（合并阶段的串行扫描）</text>
    <text x="96" y="242" font-size="15" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#1B2632">best_cid = cid; best_found = 1'b0;<tspan x="96" dy="21">for (d = 0; d &lt; SNOW_NDIR; d = d + 1)</tspan><tspan x="96" dy="21">  if (nb_valid[d] &amp;&amp; e_grown[d]) begin</tspan><tspan x="96" dy="21">    if (nb_cid[d*W +: W] == SNOW_RESET_CID) begin</tspan><tspan x="96" dy="21">      if (!unrooted) begin</tspan><tspan x="96" dy="21">        n_cid = SNOW_RESET_CID;</tspan><tspan x="96" dy="21">        n_ptr = SNOW_PTR_C; break;</tspan><tspan x="96" dy="21">      end</tspan><tspan x="96" dy="21">    end else if (nb_cid[d*W +: W] &lt; best_cid) begin</tspan><tspan x="96" dy="21">      busy_c   = 1'b1;</tspan><tspan x="96" dy="21">      best_cid = nb_cid[d*W +: W];</tspan><tspan x="96" dy="21">      best_d   = d; best_found = 1'b1;</tspan><tspan x="96" dy="21">    end</tspan><tspan x="96" dy="21">  end</tspan><tspan x="96" dy="21">if (best_found) begin</tspan><tspan x="96" dy="21">  n_ptr = DIR2PTR(best_d);   // 指向更小的那一侧</tspan><tspan x="96" dy="21">  n_cid = best_cid;</tspan><tspan x="96" dy="21">end</tspan></text>
  </g>

  <g id="why-loop" data-pptx-bounds="760 176 448 436">
    <text x="760" y="206" font-size="26" font-weight="bold" fill="#12263A">这条循环就是瓶颈</text>
    <text x="760" y="252" font-size="22" fill="#1B2632">12 层比较器串成一条链<tspan x="760" dy="30">cid_reg → 比较 → busy_c</tspan></text>
    <text x="760" y="330" font-size="22" fill="#1B2632">MINTS 把它拆成 3 组<tspan x="760" dy="30">用 3 拍换掉链的深度</tspan></text>
    <text x="760" y="408" font-size="22" fill="#1B2632">提交发生在拍边界<tspan x="760" dy="30">stage 不等于 IDLE 才写回</tspan></text>
    <text x="760" y="470" font-size="14" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#5A6672">if (stage != ST_IDLE) cid &lt;= n_cid;</text>
    <text x="760" y="508" font-size="15" fill="#5A6672">比较是严格的：平局保留自己，<tspan x="760" dy="24">否则根会在两个节点间来回跳。</tspan></text>
    <text x="760" y="574" font-size="15" fill="#B23A2E">这条链在 d7 上占 33 级，<tspan x="760" dy="24">其中约三分之二是布线。</tspan></text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">W 是 SNOW_CID_W 的简写；这一段与扁平核的循环逐字对应</text>
  </g>
</svg>
