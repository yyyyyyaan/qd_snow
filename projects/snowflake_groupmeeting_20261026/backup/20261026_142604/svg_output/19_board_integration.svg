    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="board-diagram" data-pptx-bounds="72 176 628 250">
    <rect x="72" y="210" width="160" height="80" fill="#12263A"/>
    <text x="152" y="246" font-size="26" fill="#FFFFFF" text-anchor="middle">PS</text>
    <text x="152" y="274" font-size="15" fill="#D8DEE5" text-anchor="middle">写 syndrome</text>
    <line x1="232" y1="250" x2="264" y2="250" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-board)"/>
