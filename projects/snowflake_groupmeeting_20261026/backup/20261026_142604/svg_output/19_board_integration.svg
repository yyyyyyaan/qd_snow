    <rect x="272" y="210" width="200" height="80" fill="#F2F4F7"/>
    <text x="372" y="246" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A" text-anchor="middle">host_regs</text>
    <text x="372" y="274" font-size="15" fill="#5A6672" text-anchor="middle">寄存器接口</text>
    <line x1="472" y1="250" x2="504" y2="250" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-board)"/>
    <text x="478" y="240" font-size="15" fill="#5A6672">配置</text>
    <rect x="512" y="200" width="160" height="100" fill="#FFFFFF" stroke="#B23A2E" stroke-width="1.6"/>
    <text x="592" y="244" font-size="18" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A" text-anchor="middle">lat1</text>
    <text x="592" y="274" font-size="15" fill="#5A6672" text-anchor="middle">解码阵列</text>
    <line x1="552" y1="300" x2="552" y2="360" stroke="#12263A" stroke-width="1.4"/>
    <line x1="552" y1="360" x2="480" y2="360" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-board)"/>
    <text x="560" y="338" font-size="15" fill="#5A6672">轨迹流</text>
    <rect x="272" y="330" width="200" height="70" fill="#F2F4F7"/>
    <text x="372" y="360" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A" text-anchor="middle">trace_capture</text>
    <text x="372" y="386" font-size="15" fill="#5A6672" text-anchor="middle">片上轨迹 RAM</text>
  </g>

  <g id="reset-chain" data-pptx-bounds="760 176 448 250">
    <text x="760" y="198" font-size="15" fill="#5A6672" letter-spacing="1.2">复位链</text>
    <rect x="760" y="210" width="448" height="56" fill="#F2F4F7"/>
    <text x="784" y="246" font-size="22" fill="#12263A">异步复位进入</text>
    <line x1="984" y1="266" x2="984" y2="282" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-board)"/>
    <rect x="760" y="286" width="448" height="56" fill="#F2F4F7"/>
