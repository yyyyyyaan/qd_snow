    <line x1="984" y1="342" x2="984" y2="358" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-board)"/>
    <rect x="760" y="362" width="448" height="56" fill="#F2F4F7"/>
    <text x="784" y="398" font-size="22" fill="#12263A">分域拉长，同步释放</text>
  </g>

  <g id="no-cdc" data-pptx-bounds="72 440 628 60">
    <rect x="72" y="440" width="628" height="60" fill="#F2F4F7"/>
    <rect x="72" y="440" width="4" height="60" fill="#2C6E9B"/>
    <text x="104" y="477" font-size="22" fill="#12263A">全设计单时钟域：没有跨时钟域路径</text>
  </g>

  <g id="maxrec" data-pptx-bounds="760 440 448 130">
    <text x="760" y="470" font-size="22" font-weight="bold" fill="#12263A">MAXREC 必须是 2 的幂</text>
    <text x="760" y="504" font-size="22" fill="#1B2632">指针靠位宽回绕，非 2 的幂<tspan x="760" dy="30">会算错地址</tspan></text>
    <text x="760" y="562" font-size="15" fill="#5A6672">综合期还有一条 FATAL 检查兜底</text>
  </g>

  <g id="missing" data-pptx-bounds="72 576 1136 58">
    <text x="72" y="606" font-size="22" fill="#B23A2E">仍缺：XDC、PS7 block design、bitstream、FSBL、BOOT.bin</text>
    <text x="72" y="628" font-size="15" fill="#5A6672">host 代码写了但从未编译运行；板级 D8 测试尚未开始</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">单时钟域降低了 CDC 风险，但没有降低板级流程的工作量</text>
    <text x="1208" y="666" font-size="15" fill="#5A6672" text-anchor="end">19 / 26</text>
  </g>
