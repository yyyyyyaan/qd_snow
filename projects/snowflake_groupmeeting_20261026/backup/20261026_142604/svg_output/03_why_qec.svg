<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">01 / 背景与问题定义</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">一个逻辑比特，要用上千个物理比特来守</text>
    <rect x="1184" y="40" width="8" height="8" fill="#5A6672"/>
    <text x="1208" y="49" font-size="15" fill="#5A6672" text-anchor="end">基础</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="hero-number" data-pptx-bounds="72 180 420 240">
    <text x="72" y="322" font-size="96" font-weight="bold" fill="#12263A">≈ 4d²</text>
    <text x="72" y="374" font-size="22" fill="#1B2632">个物理比特，守 1 个逻辑比特</text>
    <text x="72" y="408" font-size="15" fill="#5A6672">数据比特 2d²−1，加上测量比特，量级约 4d²</text>
  </g>

  <g id="scale-list" data-pptx-bounds="600 180 400 240">
    <text x="600" y="208" font-size="15" fill="#5A6672">码距 d</text>
    <text x="960" y="208" font-size="15" fill="#5A6672" text-anchor="end">物理比特</text>
    <line x1="600" y1="220" x2="960" y2="220" stroke="#D8DEE5" stroke-width="1"/>
    <text x="600" y="252" font-size="22" fill="#1B2632">d = 3</text>
    <text x="960" y="252" font-size="22" fill="#1B2632" text-anchor="end">≈ 36</text>
    <text x="600" y="288" font-size="22" fill="#1B2632">d = 5</text>
    <text x="960" y="288" font-size="22" fill="#1B2632" text-anchor="end">≈ 100</text>
    <text x="600" y="324" font-size="22" fill="#1B2632">d = 7</text>
    <text x="960" y="324" font-size="22" fill="#1B2632" text-anchor="end">≈ 196</text>
    <line x1="600" y1="344" x2="960" y2="344" stroke="#D8DEE5" stroke-width="1"/>
    <text x="600" y="380" font-size="22" fill="#12263A">d = 21</text>
    <text x="960" y="380" font-size="22" font-weight="bold" fill="#12263A" text-anchor="end">≈ 1,764</text>
  </g>

  <g id="takeaway" data-pptx-bounds="72 500 1136 80">
    <rect x="72" y="500" width="1136" height="80" fill="#F2F4F7"/>
    <rect x="72" y="500" width="4" height="80" fill="#B23A2E"/>
    <text x="104" y="548" font-size="26" fill="#12263A">低于阈值，逻辑错误率随 d 指数下降；代价是面积按 d² 增长。</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">表面码的常规量级；图中数字按 4d² 估算</text>
    <text x="1208" y="666" font-size="15" fill="#5A6672" text-anchor="end">03 / 26</text>
  </g>
</svg>
