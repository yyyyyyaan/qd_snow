  <g id="why-not-additive" data-pptx-bounds="800 176 408 300">
    <text x="800" y="212" font-size="26" font-weight="bold" fill="#12263A">为什么不是加法</text>
    <text x="800" y="258" font-size="22" fill="#1B2632">MINTS 压比较链<tspan x="800" dy="30">BUSYREG 压归约链</tspan></text>
    <text x="800" y="330" font-size="22" fill="#1B2632">两者落在同一条路径的两端<tspan x="800" dy="30">叠加收益远小于外推</tspan></text>
    <text x="800" y="402" font-size="22" fill="#1B2632">常数驱动端口也不免费<tspan x="800" dy="30">d3 上实测 +3.8% LUT</tspan></text>
  </g>

  <g id="timing-note" data-pptx-bounds="72 520 1136 80">
    <rect x="72" y="520" width="1136" height="80" fill="#F2F4F7"/>
    <rect x="72" y="520" width="4" height="80" fill="#B23A2E"/>
    <text x="104" y="556" font-size="22" fill="#12263A">d7 仍差 1.36 ns：这不是再调几个参数能解决的，需要新结构。</text>
    <text x="104" y="584" font-size="15" fill="#5A6672">实心点为优化后，空心点为优化前；只有 d3 落在 5 ns 以内</text>
  </g>

