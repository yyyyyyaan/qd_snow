    <line x1="262" y1="260" x2="286" y2="260" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-flow)"/>
    <rect x="296" y="220" width="190" height="80" fill="#F2F4F7"/>
    <text x="391" y="254" font-size="22" fill="#12263A" text-anchor="middle">localuf</text>
    <text x="391" y="282" font-size="15" fill="#5A6672" text-anchor="middle">出图 + 黄金轨迹</text>
    <line x1="486" y1="260" x2="510" y2="260" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-flow)"/>
    <rect x="520" y="220" width="190" height="80" fill="#F2F4F7"/>
    <text x="615" y="254" font-size="22" fill="#12263A" text-anchor="middle">生成器</text>
    <text x="615" y="282" font-size="15" fill="#5A6672" text-anchor="middle">.svh + _part.json</text>
    <line x1="710" y1="260" x2="734" y2="260" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-flow)"/>
    <rect x="744" y="220" width="190" height="80" fill="#12263A"/>
    <text x="839" y="254" font-size="22" fill="#FFFFFF" text-anchor="middle">PS</text>
    <text x="839" y="282" font-size="15" fill="#D8DEE5" text-anchor="middle">写 syndrome</text>
    <line x1="934" y1="260" x2="958" y2="260" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-flow)"/>
    <rect x="968" y="220" width="190" height="80" fill="#12263A"/>
    <text x="1063" y="254" font-size="22" fill="#FFFFFF" text-anchor="middle">FPGA</text>
