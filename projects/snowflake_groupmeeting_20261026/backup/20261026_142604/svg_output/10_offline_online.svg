  </g>

  <g id="online-label" data-pptx-bounds="744 180 464 30">
    <text x="744" y="200" font-size="15" fill="#2C6E9B" letter-spacing="1.2">在线：运行时只有 PS 与 FPGA</text>
  </g>

  <g id="pipeline" data-pptx-bounds="72 220 1086 80">
