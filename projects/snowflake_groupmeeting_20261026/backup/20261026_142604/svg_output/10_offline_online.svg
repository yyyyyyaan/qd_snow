  <line id="domain-divider" data-pptx-role="decoration" x1="727" y1="196" x2="727" y2="340" stroke="#D8DEE5" stroke-width="1.2" stroke-dasharray="4,4"/>

  <g id="hazard" data-pptx-bounds="72 400 1136 120">
    <rect x="72" y="400" width="1136" height="120" fill="#F2F4F7"/>
    <rect x="72" y="400" width="4" height="120" fill="#B23A2E"/>
    <text x="104" y="436" font-size="15" fill="#B23A2E" letter-spacing="1.2">当前隐患</text>
    <text x="104" y="472" font-size="22" fill="#1B2632">canonical snowflake_graph.svh 是过期别名，构建前必须重钉</text>
    <text x="104" y="502" font-size="15" fill="#5A6672">它缺 SNOW_PE_STW 与 SNOW_PTR_DOWN_MASK 两个常量，编译不会报错，行为会错</text>
