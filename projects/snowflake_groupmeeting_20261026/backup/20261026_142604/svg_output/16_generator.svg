<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-gen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12263A"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">04 / RTL 实现与综合结果</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">图在综合前就是常量，运行时没有查表</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="gen-input" data-pptx-bounds="72 220 228 120">
    <rect x="72" y="230" width="228" height="100" fill="#F2F4F7"/>
    <text x="96" y="272" font-size="22" fill="#12263A">噪声模型</text>
    <text x="96" y="302" font-size="15" fill="#5A6672">码型、码距、p</text>
  </g>

  <g id="gen-arrow-1" data-pptx-bounds="300 260 50 40">
    <line x1="302" y1="280" x2="346" y2="280" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-gen)"/>
  </g>

  <g id="gen-box" data-pptx-bounds="350 220 300 120">
    <rect x="350" y="230" width="300" height="100" fill="#12263A"/>
    <text x="374" y="270" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#FFFFFF">generate_snowflake.py</text>
    <text x="374" y="300" font-size="15" fill="#D8DEE5">离线运行一次</text>
  </g>

  <g id="gen-arrow-2" data-pptx-bounds="650 260 50 40">
    <line x1="652" y1="280" x2="696" y2="280" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-gen)"/>
  </g>

  <g id="gen-tables" data-pptx-bounds="700 196 508 190">
    <text x="700" y="212" font-size="15" fill="#5A6672" letter-spacing="1.2">输出：一张张常量表</text>
    <text x="700" y="246" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">SNOW_NN</text>
    <text x="880" y="246" font-size="15" fill="#5A6672">节点数</text>
    <text x="700" y="278" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">SNOW_NE</text>
    <text x="880" y="278" font-size="15" fill="#5A6672">边数</text>
    <text x="700" y="310" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">SNOW_IS_BND</text>
    <text x="880" y="310" font-size="15" fill="#5A6672">是否边界节点</text>
    <text x="700" y="342" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">SNOW_NB</text>
    <text x="880" y="342" font-size="15" fill="#5A6672">邻居偏移</text>
    <text x="700" y="374" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">SNOW_SYN_IDX</text>
    <text x="880" y="374" font-size="15" fill="#5A6672">综合症索引</text>
  </g>

  <g id="zero-facts" data-pptx-bounds="72 430 1136 100">
    <line x1="72" y1="430" x2="1208" y2="430" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="462" font-size="15" fill="#5A6672">解码器本体</text>
    <text x="72" y="508" font-size="38" font-weight="bold" fill="#12263A">LUTRAM 0</text>
    <text x="460" y="462" font-size="15" fill="#5A6672">解码器本体</text>
    <text x="460" y="508" font-size="38" font-weight="bold" fill="#12263A">BRAM 0</text>
    <text x="848" y="462" font-size="15" fill="#5A6672">解码器本体</text>
    <text x="848" y="508" font-size="38" font-weight="bold" fill="#12263A">DSP 0</text>
  </g>

  <g id="gen-takeaway" data-pptx-bounds="72 550 1136 60">
    <text x="72" y="590" font-size="26" fill="#12263A">换码型 = 重跑生成器 + 重综合，RTL 一行不改。</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
