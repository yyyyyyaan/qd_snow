<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="微软雅黑, Arial, PingFang SC, Noto Sans CJK SC, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-pe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#12263A"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-head" data-pptx-bounds="72 36 1136 80">
    <text x="72" y="52" font-size="15" fill="#5A6672" letter-spacing="1.4">03 / 硬件架构与关键模块</text>
    <text x="72" y="100" font-size="38" font-weight="bold" fill="#12263A">PE 的全部难度，在合并时对邻居取最小</text>
    <rect x="1160" y="40" width="8" height="8" fill="#2C6E9B"/>
    <text x="1208" y="49" font-size="15" fill="#2C6E9B" text-anchor="end">已完成</text>
    <line x1="72" y1="118" x2="1208" y2="118" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="state-table" data-pptx-bounds="72 176 488 300">
    <text x="72" y="208" font-size="26" font-weight="bold" fill="#12263A">一个 PE 里只有这些状态</text>
    <text x="72" y="252" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">cid</text>
    <text x="220" y="252" font-size="22" fill="#1B2632">簇标识，根是谁</text>
    <text x="72" y="286" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">active / grown</text>
    <text x="220" y="286" font-size="22" fill="#1B2632">是否活跃、生长值</text>
    <text x="72" y="320" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">whole</text>
    <text x="220" y="320" font-size="22" fill="#1B2632">整簇标记</text>
    <text x="72" y="354" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">defect</text>
    <text x="220" y="354" font-size="22" fill="#1B2632">缺陷位</text>
    <text x="72" y="388" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">ptr</text>
    <text x="220" y="388" font-size="22" fill="#1B2632">父指针，沿它上推</text>
    <text x="72" y="422" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">unrooted</text>
    <text x="220" y="422" font-size="22" fill="#1B2632">是否已剥离</text>
    <text x="72" y="456" font-size="16" font-family="Consolas, Cascadia Mono, Courier New, monospace" fill="#12263A">busy</text>
    <text x="220" y="456" font-size="22" fill="#1B2632">本拍是否还要算</text>
    <line x1="72" y1="470" x2="560" y2="470" stroke="#D8DEE5" stroke-width="1"/>
  </g>

  <g id="datapath" data-pptx-bounds="620 176 588 330">
    <rect x="620" y="210" width="588" height="60" fill="#F2F4F7"/>
    <text x="644" y="248" font-size="22" fill="#1B2632">读 12 个方向的 nb_cid</text>
    <line x1="914" y1="270" x2="914" y2="294" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-pe)"/>
    <rect x="620" y="300" width="588" height="60" fill="#F2F4F7"/>
    <text x="644" y="338" font-size="22" fill="#1B2632">取最小有效 CID（std::min 的硬件形态）</text>
    <line x1="914" y1="360" x2="914" y2="384" stroke="#12263A" stroke-width="1.4" marker-end="url(#arrow-pe)"/>
    <rect x="620" y="390" width="588" height="60" fill="#FFFFFF" stroke="#B23A2E" stroke-width="1.6"/>
    <text x="644" y="428" font-size="22" fill="#12263A">写回 cid（仅当邻居更小）</text>
    <text x="620" y="486" font-size="15" fill="#5A6672">提交 ecorr 只在合并阶段结束那一刻发生一次</text>
  </g>

  <g id="ff-band" data-pptx-bounds="72 530 1136 80">
    <rect x="72" y="530" width="1136" height="80" fill="#F2F4F7"/>
    <rect x="72" y="530" width="4" height="80" fill="#2C6E9B"/>
    <text x="104" y="566" font-size="26" fill="#12263A">每节点寄存器：d3 22.1　d5 24.8　d7 26.4</text>
    <text x="104" y="594" font-size="15" fill="#5A6672">没有消息缓冲、没有地址比较，这是与 Helios 的主要差别</text>
  </g>

  <g id="page-foot" data-pptx-role="footer" data-pptx-bounds="72 636 1136 44">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="666" font-size="15" fill="#5A6672">次态逻辑在 snowflake_pe.sv:370-678，提交在 :701-727</text>
    <text x="1208" y="666" font-size="15" fill="#5A6672" text-anchor="end">12 / 26</text>
  </g>
</svg>
