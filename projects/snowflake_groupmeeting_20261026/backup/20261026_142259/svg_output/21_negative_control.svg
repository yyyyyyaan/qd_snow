    <text x="480" y="328" font-size="22" fill="#B23A2E">状态全对，提交 0/6</text>
    <text x="870" y="328" font-size="22" fill="#2C6E9B">归约改在 phase 0 采样</text>
    <line x1="72" y1="350" x2="1208" y2="350" stroke="#D8DEE5" stroke-width="1"/>
