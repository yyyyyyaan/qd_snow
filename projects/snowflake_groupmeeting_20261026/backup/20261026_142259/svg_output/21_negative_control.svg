    <text x="480" y="388" font-size="22" fill="#B23A2E">Verilog 补的是 z</text>
    <text x="870" y="388" font-size="22" fill="#2C6E9B">显式展宽后再连接</text>
    <line x1="72" y1="410" x2="1208" y2="410" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="448" font-size="22" fill="#1B2632">MINTS 与 SERIAL 直接叠加</text>
    <text x="480" y="448" font-size="22" fill="#B23A2E">无保护，静默失败</text>
    <text x="870" y="448" font-size="22" fill="#2C6E9B">组合加断言或禁用</text>
    <line x1="72" y1="470" x2="1208" y2="470" stroke="#D8DEE5" stroke-width="1"/>
    <text x="72" y="508" font-size="22" fill="#1B2632">把优化收益线性外推</text>
    <text x="480" y="508" font-size="22" fill="#B23A2E">常数端口也不免费</text>
    <text x="870" y="508" font-size="22" fill="#2C6E9B">每次组合都实测</text>
    <line x1="72" y1="530" x2="1208" y2="530" stroke="#D8DEE5" stroke-width="1"/>
