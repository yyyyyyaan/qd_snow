<text x="813" y="255" font-size="22" fill="#12263A" font-weight="bold">2. ST_GW：整簇先长</text>
<text x="813" y="298" font-size="19" fill="#1B2632">• 底行节点的指针指向窗口外，就先把簇号清成</text>
<text x="813" y="324" font-size="19" fill="#1B2632">  RESET，准备重新找根</text>
<text x="813" y="362" font-size="19" fill="#1B2632">• 活跃的整簇发一个生长脉冲，边把生长值加半条</text>
<text x="813" y="400" font-size="19" fill="#1B2632">• 整簇标志翻转，grown 置 1：这一轮已经长过，</text>
<text x="813" y="426" font-size="19" fill="#1B2632">  第二轮不再长</text>
<text x="813" y="486" font-size="15" fill="#B23A2E">坑：旧写法用 ptr == SNOW_PTR_D 判断向下；</text>
<text x="813" y="508" font-size="15" fill="#B23A2E">电路级方向名 SD/WD/NWD 也含 D，</text>
<text x="813" y="530" font-size="15" fill="#B23A2E">7,120 行轨迹里漏了 25 行。</text>
<text x="813" y="552" font-size="15" fill="#B23A2E">现在改用生成器导出的位掩码。</text>

