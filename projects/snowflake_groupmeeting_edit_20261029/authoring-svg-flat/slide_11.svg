<text x="813" y="252" font-size="22" fill="#12263A" font-weight="bold">1. Drop：窗口上移一层</text>
<text x="813" y="292" font-size="19" fill="#1B2632">• 清掉 grown 与 unrooted，上一轮的状态不带进来</text>
<text x="813" y="328" font-size="19" fill="#1B2632">• 有上层的节点：继承簇号、活跃、整簇标记、</text>
<text x="813" y="354" font-size="19" fill="#1B2632">  缺陷和指针</text>
<text x="813" y="392" font-size="19" fill="#1B2632">• 簇号不照抄，先加一个增量，换成当前层的编号</text>
<text x="813" y="456" font-size="19" fill="#1B2632">• 顶层节点清缺陷与活跃；带综合征的节点</text>
<text x="813" y="482" font-size="19" fill="#1B2632">  把新测量异或进缺陷</text>
<text x="813" y="520" font-size="19" fill="#1B2632">• 提交本周期内的综合症输出</text>
<text x="813" y="560" font-size="15" fill="#B23A2E">为什么是拉不是推：PE 只能读邻居的输出，</text>
<text x="813" y="584" font-size="15" fill="#B23A2E">写不了邻居的寄存器，所以 DROP 由自己拉取。</text>

</g>
</g>
