</g><text x="62" y="140" font-size="15" fill="#1B2632">缺陷是两次测量的差异：稳定子的结果翻了，就在图上记一个点。</text>
<text x="62" y="162" font-size="15" fill="#1B2632">相邻两次测量共用数据比特，一个物理错误会同时点亮两个点。</text>
<text x="62" y="610" font-size="15" fill="#1B2632">配对路径跨过西—东边界，说明错误链穿过整个码距，</text>
<text x="62" y="632" font-size="15" fill="#1B2632">这一轮要翻一个逻辑比特。</text>
<text x="62" y="654" font-size="15" fill="#1B2632">路径落在内部，就只是普通数据错误，按边修正。</text>
