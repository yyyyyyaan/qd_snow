<image data-pptx-object="picture" data-pptx-frame="16.63 247.78 764 280" href="../images/image10.png" x="16.63" y="247.78" width="764" height="280" preserveAspectRatio="none" />
</g><text x="813" y="460" font-size="15" fill="#B23A2E">为什么有第二轮：第一轮整簇长完变成半簇，</text>
<text x="813" y="482" font-size="15" fill="#B23A2E">这一轮只补没长过的那些，正好连上半条边。</text>
<text x="813" y="504" font-size="15" fill="#B23A2E">两个半簇在半条边距相遇时只有一方再长，</text>
<text x="813" y="526" font-size="15" fill="#B23A2E">所以不会过冲，也不会出现混合簇（Prop. 1）。</text>
</svg>
