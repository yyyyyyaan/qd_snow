<text x="813" y="266" font-size="22" fill="#12263A" font-weight="bold">2. ST_GH：第二轮只长半簇</text>
<text x="813" y="310" font-size="19" fill="#1B2632">• 活跃、半簇、且这一轮还没长过的簇，才发</text>
<text x="813" y="336" font-size="19" fill="#1B2632">  一个生长脉冲</text>
<text x="813" y="380" font-size="19" fill="#1B2632">• 长完把整簇标志翻回去</text>

</g>
