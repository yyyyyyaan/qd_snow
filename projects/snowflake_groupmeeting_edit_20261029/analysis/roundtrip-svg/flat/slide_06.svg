<metadata data-pptx-part="txbody" data-pptx-encoding="base64" data-pptx-text-sha256="c9a1b8408bb5328ea5f95bb744fb201f2436aee63e17232f1693e5bdb380fb22"></metadata>
<text x="135.17" y="584.02221592" text-anchor="start" xml:space="preserve" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" fill="#12263A" letter-spacing="1" data-pptx-text-baseline="metrics-v1"><tspan fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">两个红点（缺陷）各自拥有一个簇</tspan><tspan fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">，</tspan><tspan fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">它们向外长出半条边</tspan><tspan fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">。</tspan><tspan fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">两个簇在中间相遇并连通。一旦连通，算法认为它们属于同一个簇。为了准备最终输</tspan><tspan x="135.17" dy="17.92" fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">出修正路径，算法会选一个共同的“根”，并把里面的缺陷（红点）往中间拉。连接它们的黑线就是被标记的修正边。合并后的新簇外围继续长</tspan><tspan x="135.17" dy="17.92" fill="#12263A" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14.93" letter-spacing="1">出实线/虚线，把整个区域包裹起来。此时黑线（修正链）确定完毕，标志着这个合并后的簇结束运作。</tspan></text>
</g>
</g>
